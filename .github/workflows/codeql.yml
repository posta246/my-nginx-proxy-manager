name: CodeQL

# Static analysis / code scanning for JavaScript & TypeScript to surface
# vulnerabilities (CVEs and insecure code patterns) in this repository.

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  schedule:
    # Weekly deep scan, every Monday at 04:00 UTC.
    - cron: "0 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
