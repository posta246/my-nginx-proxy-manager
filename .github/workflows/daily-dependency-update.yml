name: Daily Dependency Update

# Every day this workflow:
#   1. upgrades JavaScript dependencies within their declared semver ranges and
#      writes a dated report to logs/updates/YYYY-MM-DD.md,
#   2. commits the result to a dated branch and opens a pull request,
#   3. merges that pull request into develop,
#   4. creates a GitHub release named and tagged YYYY.MM.DD.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# The privileged repository operations below use the GitHub App token.
# Keep the default GITHUB_TOKEN minimally privileged.
permissions:
  contents: read

concurrency:
  group: daily-dependency-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # Generate a short-lived installation token for the GitHub App.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DAILY_UPDATE_APP_ID }}
          private-key: ${{ secrets.DAILY_UPDATE_APP_PRIVATE_KEY }}

      # Passing the App token to checkout makes the git remote use the
      # GitHub App credentials for subsequent git push operations.
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git identity
        run: |
          git config user.name "daily-dependency-update-new[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute run variables
        id: vars
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "branch=automated/dependency-updates-$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Create dated update branch
        run: |
          git checkout -B \
            "${{ steps.vars.outputs.branch }}" \
            origin/develop

      - name: Run daily dependency update
        run: ./scripts/ci/daily-dependency-update.sh

      - name: Commit and push changes
        id: commit
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit today; skipping PR, merge and release."
            exit 0
          fi

          git commit \
            -m "chore(deps): daily dependency update ${{ steps.vars.outputs.date }}"

          git push \
            --force-with-lease \
            -u origin \
            "${{ steps.vars.outputs.branch }}"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          BRANCH="${{ steps.vars.outputs.branch }}"

          EXISTING="$(
            gh pr list \
              --head "$BRANCH" \
              --base develop \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "chore(deps): daily dependency update ${{ steps.vars.outputs.date }}" \
              --body "Automated daily dependency & CVE update.

          See the full report in \`logs/updates/${{ steps.vars.outputs.date }}.md\`."
          else
            echo "Reusing existing PR #$EXISTING for $BRANCH"
          fi

      - name: Merge pull request into develop
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge \
            "${{ steps.vars.outputs.branch }}" \
            --merge \
            --delete-branch

      - name: Create daily release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          TAG="${{ steps.vars.outputs.tag }}"
          NOTES_FILE="logs/updates/${{ steps.vars.outputs.date }}.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" \
              --target develop \
              --title "$TAG" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              --target develop \
              --title "$TAG" \
              --notes "Automated daily dependency & CVE update ${{ steps.vars.outputs.date }}."
          fi
